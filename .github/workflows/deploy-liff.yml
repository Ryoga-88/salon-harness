name: Build LIFF

on:
  push:
    branches: [main]
    paths:
      - "apps/liff/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-liff.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build LIFF
        run: pnpm --filter @salon-harness/liff build
        env:
          VITE_API_URL: ${{ secrets.LIFF_API_URL }}
          VITE_API_KEY: ${{ secrets.LIFF_API_KEY }}
